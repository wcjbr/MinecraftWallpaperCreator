[package]
name = "wallpaper-core"
version = "0.1.0"
edition = "2021"

[dependencies]
image = { version = "0.25.10", default-features = false, features = ["png"] }
ndarray = "0.17.2"
ort = { version = "2.0.0-rc.12", default-features = false, features = ["std", "ndarray", "download-binaries", "copy-dylibs", "tls-native", "api-24"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
